apiVersion: pockets.dev/v1alpha1
kind: Pocket
metadata:
  id: local-dice
  name: Local Dice
  version: "0.1.0"
  description: Roll one six-sided die; last roll and roll count persist.
runtime:
  image: localhost/pockets-local-dice:0.1.0
  architectures: [arm64]
web:
  port: 8080
  healthcheck: /health
storage:
  name: data
  path: /data
