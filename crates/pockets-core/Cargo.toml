[package]
name = "pockets-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform local runtime, lifecycle, preview, and Tailscale core for Pockets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = [
    "fs",
    "process",
    "time",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3"
