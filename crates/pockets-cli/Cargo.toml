[package]
name = "pockets-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform Pockets CLI and local web dashboard daemon"

[[bin]]
name = "pockets"
path = "src/main.rs"

[dependencies]
pockets-core = { path = "../pockets-core" }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "io-util",
] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
