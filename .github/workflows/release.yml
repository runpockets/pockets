name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-15-intel
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build and package archives
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          POCKETS_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          for target in $(echo "${{ matrix.targets }}" | tr ',' ' '); do
            cargo build --release --target "$target" -p pockets-cli
            tar -czf "release/pockets-${{ github.ref_name }}-${target}.tar.gz" \
              -C "target/${target}/release" pockets
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pockets-${{ matrix.name }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum pockets-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew tap token
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic Homebrew tap update."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          path: pockets
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          repository: runpockets/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Formula/pockets.rb
        if: steps.check.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_MAC=$(sha256sum "artifacts/pockets-v${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          X64_MAC=$(sha256sum "artifacts/pockets-v${VERSION}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          ARM64_LINUX=$(sha256sum "artifacts/pockets-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          X64_LINUX=$(sha256sum "artifacts/pockets-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          mkdir -p homebrew-tap/Formula
          cp pockets/packaging/homebrew/pockets.rb homebrew-tap/Formula/pockets.rb
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_ARM64_SHA256/${ARM64_MAC}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_X86_64_SHA256/${X64_MAC}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_LINUX_ARM64_SHA256/${ARM64_LINUX}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_LINUX_X86_64_SHA256/${X64_LINUX}/" homebrew-tap/Formula/pockets.rb
          cd homebrew-tap
          git config user.name "runpockets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/pockets.rb
          git diff --cached --quiet || git commit -m "chore: bump pockets to v${VERSION}"
          git push
