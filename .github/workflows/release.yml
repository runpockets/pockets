name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build pockets binary
        run: cargo build --release --target ${{ matrix.target }} -p pockets-cli
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/pockets-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" pockets
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/pockets.exe" `
            -DestinationPath "release/pockets-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pockets-${{ matrix.target }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum pockets-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew tap token
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic Homebrew tap update."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          path: pockets
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          repository: runpockets/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Formula/pockets.rb
        if: steps.check.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_MAC=$(sha256sum "artifacts/pockets-v${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          X64_MAC=$(sha256sum "artifacts/pockets-v${VERSION}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          ARM64_LINUX=$(sha256sum "artifacts/pockets-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          X64_LINUX=$(sha256sum "artifacts/pockets-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          mkdir -p homebrew-tap/Formula
          cp pockets/packaging/homebrew/pockets.rb homebrew-tap/Formula/pockets.rb
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_ARM64_SHA256/${ARM64_MAC}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_X86_64_SHA256/${X64_MAC}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_LINUX_ARM64_SHA256/${ARM64_LINUX}/" homebrew-tap/Formula/pockets.rb
          sed -i "s/REPLACE_WITH_LINUX_X86_64_SHA256/${X64_LINUX}/" homebrew-tap/Formula/pockets.rb
          cd homebrew-tap
          git config user.name "runpockets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/pockets.rb
          git diff --cached --quiet || git commit -m "chore: bump pockets to v${VERSION}"
          git push
