apiVersion: pockets.dev/v1alpha1
kind: Pocket
metadata:
  id: __POCKET_ID__
  name: __POCKET_NAME__
  version: "0.1.0"
  description: A small persistent web app you control.
runtime:
  image: localhost/pockets-__POCKET_ID__:local
  architectures: [__POCKET_ARCH__]
web:
  port: 8080
  healthcheck: /health
storage:
  name: data
  path: /data
# Optional: declare runtime environment variables accepted by this Pocket.
# Values are never placed here; Pockets stores them locally per environment.
# runtimeVariables:
#   - name: PRICING_API_KEY
#     kind: secret # secret | plain
#     required: true
#     purpose: Authenticates quote lookups with the market data provider.
